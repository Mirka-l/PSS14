- type: entity
  abstract: true
  parent: BaseWindoorGeneric
  id: BaseClockworkWindoor
  name: clockwork windoor
  components:
  - type: Sprite
    sprite: Structures/Doors/Windoors/clockwork_windoor.rsi
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]
    - map: ["enum.DoorVisualLayers.BasePowered"]
      shader: unshaded
      visible: false
    - map: ["enum.DoorVisualLayers.BaseAccessGranted"]
      shader: unshaded
      visible: false
    - map: ["enum.WeldableLayers.BaseWelded"]
      visible: false
    - map: ["enum.DoorVisualLayers.BaseBolted"]
      shader: unshaded
      visible: false
    - map: ["enum.DoorVisualLayers.BaseEmergencyAccess"]
      shader: unshaded
      visible: false
    - map: ["enum.WiresVisualLayers.MaintenancePanel"]
    - map: ["enum.DoorVisualLayers.BaseDeny"]
      shader: unshaded
      visible: false
    - state: electrified_ai
      sprite: Interface/Misc/ai_hud.rsi
      shader: unshaded
      visible: false
      map: ["enum.ElectrifiedLayers.HUD"]
    - state: electrified
      sprite: Effects/electricity.rsi
      shader: unshaded
      visible: false
      map: ["enum.ElectrifiedLayers.Sparks"]
    - state: sparks
      sprite: Structures/Doors/Airlocks/Overlays/Windoor/effects.rsi
      map: ["enum.DoorVisualLayers.BaseEmagging"]
      shader: unshaded
      visible: false
      loop: false
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlassClockwork:
            min: 1
            max: 2
          SheetBrass1:
            min: 0
            max: 2
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Construction
    graph: Windoor
    node: windoorClockwork
    containers:
    - board
  - type: StaticPrice
    price: 240
