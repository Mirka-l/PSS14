- type: entity
  abstract: true
  parent: BaseStructure
  id: BaseWindoorGeneric
  placement:
    mode: SnapgridCenter
  components:
  - type: Anchorable
    flags:
    - Anchorable
  - type: Rotatable
  - type: MeleeSound
    soundGroups:
      Brute:
        collection: GlassSmash
  - type: InteractionOutline
  - type: StationAiWhitelist
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,-0.36"
        density: 1500
        mask:
        - TabletopMachineMask
        layer:
        - GlassAirlockLayer
  - type: Sprite
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]
    - map: ["enum.DoorVisualLayers.BasePowered"]
      shader: unshaded
      visible: false
    - map: ["enum.DoorVisualLayers.BaseAccessGranted"]
      shader: unshaded
      visible: false
    - map: ["enum.WeldableLayers.BaseWelded"]
      visible: false
    - map: ["enum.DoorVisualLayers.BaseBolted"]
      shader: unshaded
      visible: false
    - map: ["enum.DoorVisualLayers.BaseEmergencyAccess"]
      shader: unshaded
      visible: false
    - map: ["enum.WiresVisualLayers.MaintenancePanel"]
    - map: ["enum.DoorVisualLayers.BaseDeny"]
      shader: unshaded
      visible: false
    - state: electrified_ai
      sprite: Interface/Misc/ai_hud.rsi
      shader: unshaded
      visible: false
      map: ["enum.ElectrifiedLayers.HUD"]
    - state: electrified
      sprite: Effects/electricity.rsi
      shader: unshaded
      visible: false
      map: ["enum.ElectrifiedLayers.Sparks"]
    - state: sparks
      sprite: Structures/Doors/Airlocks/Overlays/Windoor/effects.rsi
      map: ["enum.DoorVisualLayers.BaseEmagging"]
      shader: unshaded
      visible: false
      loop: false
  - type: AnimationPlayer
  - type: ApcPowerReceiver
  - type: ExtensionCableReceiver
  - type: DoorSignalControl
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: BasicDevice
  - type: WirelessNetworkConnection
    range: 200
  - type: DeviceLinkSink
    ports:
    - Open
    - Close
    - Toggle
    - AutoClose
    - DoorBolt
  - type: DeviceLinkSource
    ports:
    - DoorStatus
    lastSignals:
      DoorStatus: false
  - type: Damageable
    damageModifierSet: Glass
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: ExaminableDamage
    messages: WindowMessages
  - type: RCDDeconstructable
    cost: 8
    delay: 8
    fx: EffectRCDDeconstruct8
  - type: ContainerFill
    containers:
      board: [ DoorElectronics ]
  - type: AccessReader
    containerAccessProvider: board
  - type: ContainerContainer
    containers:
      board: !type:Container
  - type: Door
    canCrush: false
    openingAnimationTime: 0.9
    closingAnimationTime: 0.9
    openSound:
      path: /Audio/Machines/windoor_open.ogg
    closeSound:
      path: /Audio/Machines/windoor_open.ogg
    denySound:
      path: /Audio/Machines/airlock_deny.ogg
  - type: Airlock
    keepOpenIfClicked: true
    openPanelVisible: true
    denyAnimationTime: 0.4
    openAccessGrantedVisible: true
    # needed so that windoors loop between closing and reopening less often even though they don't crush
    safety: true
  - type: NavMapDoor
  - type: DoorBolt
  - type: Electrified
    enabled: false
    usesApcPower: true
  - type: WiresPanel
  - type: Wires
    boardName: wires-board-name-windoor
    layoutId: Airlock
  - type: UserInterface
    interfaces:
      enum.AiUi.Key:
        type: StationAiBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: Appearance
  - type: AirlockVisuals
    powered: { sprite: Structures/Doors/Airlocks/Overlays/Windoor/powered.rsi, state: closed }
    accessGranted: { sprite: Structures/Doors/Airlocks/Overlays/Windoor/access_granted.rsi, state: closed }
    welded: { sprite: Structures/Doors/Airlocks/Overlays/Windoor/welded.rsi, state: closed }
    bolted: { sprite: Structures/Doors/Airlocks/Overlays/Windoor/bolted.rsi, state: closed }
    emergencyAccess: { sprite: Structures/Doors/Airlocks/Overlays/Windoor/access_emergency.rsi, state: closed }
    panel: { sprite: Structures/Doors/Airlocks/Overlays/Windoor/panel.rsi, state: closed }
    deny: { sprite: Structures/Doors/Airlocks/Overlays/Windoor/access_deny.rsi, state: closed }
    emagging: { sprite: Structures/Doors/Airlocks/Overlays/Windoor/effects.rsi, state: sparks }
  - type: GenericVisualizer
    visuals:
      enum.DoorVisuals.State:
        enum.DoorVisualLayers.BasePowered:
          Closed: { state: closed }
          Closing: { state: closing }
          Open: { state: open }
          Opening: { state: opening }
        enum.DoorVisualLayers.BaseAccessGranted:
          Closed: { state: closed }
          Closing: { state: closing }
          Open: { state: open }
          Opening: { state: opening }
        enum.WeldableLayers.BaseWelded:
          Closed: { state: closed }
          Closing: { state: closing }
          Open: { state: open }
          Opening: { state: opening }
        enum.DoorVisualLayers.BaseBolted:
          Closed: { state: closed }
          Closing: { state: closing }
          Open: { state: open }
          Opening: { state: opening }
        enum.DoorVisualLayers.BaseEmergencyAccess:
          Closed: { state: closed }
          Closing: { state: closing }
          Open: { state: open }
          Opening: { state: opening }
        enum.WiresVisualLayers.MaintenancePanel:
          Closed: { state: closed }
          Closing: { state: closing }
          Open: { state: open }
          Opening: { state: opening }
      enum.ElectrifiedVisuals.ShowSparks:
        enum.ElectrifiedLayers.Sparks:
          True: { visible: True }
          False: { visible: False }
      enum.WiresVisuals.MaintenancePanelState:
        enum.WiresVisualLayers.MaintenancePanel:
          True: { visible: true }
          False: { visible: false }
      enum.WeldableVisuals.IsWelded:
        enum.WeldableLayers.BaseWelded:
          True: { visible: true }
          False: { visible: false }
      enum.DoorVisuals.PoweredVisible:
        enum.DoorVisualLayers.BasePowered:
          True: { visible: true }
          False: { visible: false }
      enum.DoorVisuals.AccessGrantedVisible:
        enum.DoorVisualLayers.BaseAccessGranted:
          True: { visible: true }
          False: { visible: false }
      enum.DoorVisuals.BoltedVisible:
        enum.DoorVisualLayers.BaseBolted:
          True: { visible: true }
          False: { visible: false }
      enum.DoorVisuals.EmergencyAccessVisible:
        enum.DoorVisualLayers.BaseEmergencyAccess:
          True: { visible: true }
          False: { visible: false }
      enum.DoorVisuals.DenyVisible:
        enum.DoorVisualLayers.BaseDeny:
          True: { visible: true }
          False: { visible: false }
      enum.DoorVisuals.Emagging:
        enum.DoorVisualLayers.BaseEmagging:
          True: { visible: true }
          False: { visible: false }
  - type: ElectrocutionHUDVisuals
  - type: Airtight
    noAirWhenFullyAirBlocked: false
    airBlockedDirection:
    - South
  - type: Construction
    graph: Windoor
    containers:
    - board
  - type: PryUnpowered
  - type: Tag
    tags:
    - DoorRemoteWhitelist
    # This tag is used by door remotes to allow or not a door remote to normally be able to interact with a door

- type: entity
  abstract: true
  parent: BaseWindoorGeneric
  id: BaseSecureWindoorGeneric
  components:
  - type: Sprite
    layers:
    - state: secure_underlay
    - state: closed
      map: [ "enum.DoorVisualLayers.Base" ]
    - map: [ "enum.DoorVisualLayers.BasePowered" ]
      shader: unshaded
      visible: false
    - map: [ "enum.DoorVisualLayers.BaseAccessGranted" ]
      shader: unshaded
      visible: false
    - map: [ "enum.WeldableLayers.BaseWelded" ]
      visible: false
    - map: [ "enum.DoorVisualLayers.BaseBolted" ]
      shader: unshaded
      visible: false
    - map: [ "enum.DoorVisualLayers.BaseEmergencyAccess" ]
      shader: unshaded
      visible: false
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      visible: false
    - map: [ "enum.DoorVisualLayers.BaseDeny" ]
      shader: unshaded
      visible: false
    - state: electrified_ai
      sprite: Interface/Misc/ai_hud.rsi
      shader: unshaded
      visible: false
      map: [ "enum.ElectrifiedLayers.HUD" ]
    - state: electrified
      sprite: Effects/electricity.rsi
      shader: unshaded
      visible: false
      map: [ "enum.ElectrifiedLayers.Sparks" ]
    - state: sparks
      sprite: Structures/Doors/Airlocks/Overlays/Windoor/effects.rsi
      map: ["enum.DoorVisualLayers.BaseEmagging"]
      shader: unshaded
      visible: false
      loop: false
  - type: Damageable
    damageModifierSet: RGlass
  - type: StaticPrice
    price: 150

#Normal windoors
- type: entity
  abstract: true
  parent: [ BaseDeltaPressureGlassQuarter, BaseWindoorGeneric ]
  id: BaseWindoor
  components:
  - type: Sprite
    sprite: Structures/Doors/Windoors/windoor.rsi
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlass:
            min: 1
            max: 2
          SheetSteel1:
            min: 2
            max: 4
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Construction
    node: windoor

- type: entity
  abstract: true
  parent: [ BaseDeltaPressureReinforcedGlassQuarter, BaseSecureWindoorGeneric ]
  id: BaseSecureWindoor
  components:
  - type: Sprite
    sprite: Structures/Doors/Windoors/windoor.rsi
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlass:
            min: 1
            max: 2
          SheetPlasteel1:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Construction
    graph: Windoor
    node: windoorSecure
  - type: StaticPrice
    price: 350
  - type: Tag
    tags:
      - SecureWindoor
      # This tag is used to nagivate the Airlock construction graph. It's needed because the construction graph is shared between Airlock, AirlockGlass, and HighSecDoor
      - DoorRemoteWhitelist
      # This tag is used by door remotes to allow or not a door remote to normally be able to interact with a door


